# Production: Caddy with automatic HTTPS, production replication prefix.
#   ./run.sh prod
#
# Set SITE_ADDRESS to your domain in .env. Caddy provisions a Let's Encrypt
# certificate on first request, which needs ports 80 AND 443 reachable from the
# internet - 80 is not optional, it is how the ACME challenge is answered.
services:
  db-restore:
    environment:
      LITESTREAM_PREFIX: ${LITESTREAM_S3_PREFIX:-job-doomers/database.sqlite}
  db-replicate:
    environment:
      LITESTREAM_PREFIX: ${LITESTREAM_S3_PREFIX:-job-doomers/database.sqlite}

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile.caddy
    image: adc-caddy:latest
    restart: unless-stopped
    user: "10001:0"
    # The only privilege anything here keeps. Caddy must bind 80 and 443;
    # everything else about it runs unprivileged.
    cap_add: ["NET_BIND_SERVICE"]
    env_file: [.env]
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      # Certificates live here. Losing this volume means re-issuing on restart,
      # which Let's Encrypt rate-limits, so do not prune it casually.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    mem_reservation: 24m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Self-hosted analytics, served by Caddy at GOATCOUNTER_HOST. Prod only: its
  # script ignores localhost, so a dev instance would never record anything.
  goatcounter:
    image: arp242/goatcounter:2.7.0
    restart: unless-stopped
    environment:
      # Plain HTTP behind Caddy. Without this GoatCounter defaults to its own
      # ACME outside dev mode and would fight Caddy for the certificate.
      GOATCOUNTER_TLS: http
      GOATCOUNTER_LISTEN: ":8080"
    volumes:
      # SQLite lives here. Not replicated by Litestream - losing the volume
      # loses the stats history, never anything the main site depends on.
      - goatcounter-data:/home/goatcounter/goatcounter-data
    expose: ["8080"]
    # A static Go binary on SQLite; the image runs as its own unprivileged user.
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
  goatcounter-data:
