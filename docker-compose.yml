#run with
#   dev  (nginx, plain HTTP on localhost) : -f docker-compose.yml -f docker-compose.dev.yml
#   prod (Caddy, automatic HTTPS)         : -f docker-compose.yml -f docker-compose.prod.yml

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Litestream needs the same three things in both of its containers.
x-litestream: &litestream
  image: litestream/litestream:0.3.13
  env_file: [.env]
  volumes:
    - data:/data
    - ./litestream/litestream.yml:/etc/litestream.yml:ro
  logging: *logging

services:
  # Runs once at startup and exits: if there is no local database but a replica
  # exists in S3, pull it down before anything opens the file. This is what makes
  # a replaced instance come back with its history instead of an empty chart.
  db-restore:
    <<: *litestream
    restart: "no"
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Ordering matters here. api and worker wait on this container exiting
        # 0, so anything that exits non-zero holds the whole site down.
        if [ -f /data/jobs.db ]; then
          echo "local database present - skipping restore"
          exit 0
        fi
        if [ -z "$${S3_BUCKET:-}" ]; then
          echo "S3_BUCKET unset - starting with no database, the worker will create one"
          exit 0
        fi
        # No local database: a failure here is worth blocking on. Starting
        # anyway would quietly begin a fresh history and orphan the replica.
        if ! litestream restore -if-replica-exists \
             -config /etc/litestream.yml /data/jobs.db; then
          echo "RESTORE FAILED and there is no local database." >&2
          echo "Refusing to start rather than silently begin an empty history." >&2
          echo "Check credentials and LITESTREAM_PREFIX, or touch /data/jobs.db" >&2
          echo "inside the data volume to start fresh deliberately." >&2
          exit 1
        fi
        echo "restore step complete"

  # Continuous replication. Tails the WAL and ships to S3 every sync interval.
  db-replicate:
    <<: *litestream
    restart: unless-stopped
    depends_on:
      db-restore:
        condition: service_completed_successfully
    # Measured peaking at 41 MiB against a 48 MiB cap with only a 2.7 MB
    # database. Litestream buffers WAL segments and snapshots while uploading,
    # so its peak tracks database size - which is projected at ~200 MB after a
    # year. An OOM here kills replication quietly, so give it real headroom.
    mem_limit: 96m
    mem_reservation: 24m
    cpus: 0.25
    pids_limit: 64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${S3_BUCKET:-}" ]; then
          echo "S3_BUCKET unset - replication disabled"
          exec sleep infinity
        fi
        # The worker creates the database on its first run; wait rather than
        # crash-looping until it exists.
        while [ ! -f /data/jobs.db ]; do
          echo "waiting for /data/jobs.db"; sleep 10
        done
        exec litestream replicate -config /etc/litestream.yml

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: adc-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_DIR: /data
      DB_PATH: /data/jobs.db
    depends_on:
      db-restore:
        condition: service_completed_successfully
    volumes:
      # Read-write on purpose: SQLite in WAL mode must touch the -shm sidecar
      # even to read. The API opens the file with `file:...?mode=ro` instead.
      - data:/data
    # Measured at 44 MiB serving live traffic; 112 leaves 2.5x. The 48 MiB
    # freed here is what pays for db-replicate's raise, so the totals are
    # unchanged: 752 MiB dev, 784 MiB prod.
    mem_limit: 112m
    mem_reservation: 48m
    cpus: 0.75
    pids_limit: 128
    logging: *logging
    expose: ["8000"]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: adc-worker:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_DIR: /data
      DB_PATH: /data/jobs.db
      # Litestream already replicates continuously; the nightly gzip of the
      # whole file would be a second, coarser copy of the same data.
      DB_BACKUP_TO_S3: "false"
    depends_on:
      db-restore:
        condition: service_completed_successfully
    volumes:
      - data:/data
    # The ceiling a scrape may reach. It idles far below this: the scheduler
    # spawns the pipeline as a child process and reclaims everything on exit.
    mem_limit: 512m
    mem_reservation: 48m
    cpus: 1.0
    pids_limit: 128
    logging: *logging

volumes:
  data:
