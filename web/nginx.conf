# No `upstream` block on purpose. nginx resolves the names inside one exactly
# once, at startup — so every time the api container is recreated (a redeploy,
# a crash, an OOM) it gets a fresh IP and nginx keeps proxying to the dead one,
# answering 502 until nginx itself is restarted. Resolving through Docker's
# embedded DNS at request time costs a cached lookup and survives redeploys.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small box: keep buffers modest rather than default-generous.
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # The variable is what forces re-resolution; a literal name here would
        # be resolved once at startup just like an upstream block.
        set $api_host "api:8000";
        proxy_pass http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
